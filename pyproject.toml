[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradutor-talk"
version = "0.1.0"
description = "Intérprete bidirecional de conversação em tempo real."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
audio = ["sounddevice>=0.5"]
openai = ["openai>=1.50"]
runtime = ["sounddevice>=0.5", "openai>=1.50"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
