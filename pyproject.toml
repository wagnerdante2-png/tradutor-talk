[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradutor-talk"
version = "0.2.0"
description = "Intérprete bidirecional de conversação em tempo real."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
audio = ["sounddevice>=0.5,<1"]
vad = ["webrtcvad-wheels==2.0.14"]
openai = ["openai>=3.17,<4"]
runtime = [
    "sounddevice>=0.5,<1",
    "webrtcvad-wheels==2.0.14",
    "openai>=3.17,<4",
]

[project.scripts]
tradutor-talk = "tradutor_talk.app.main:main"
tradutor-talk-test = "tradutor_talk.app.windows_test:main"
tradutor-talk-devices = "tradutor_talk.app.device_probe:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
