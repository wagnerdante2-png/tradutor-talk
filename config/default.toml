[session]
provider_timeout_seconds = 10.0

[context]
max_turns = 8

[glossary]
path = "config/glossary.example.json"

[audio]
sample_rate = 16000
channels = 1
block_ms = 20
dtype = "int16"

[vad]
aggressiveness = 2
pre_roll_ms = 200
start_speech_ms = 60
end_silence_ms = 600
wait_timeout_seconds = 30.0
max_utterance_seconds = 20.0

[providers.openai]
stt_model = "gpt-transcribe"
translation_model = "gpt-6-luna"
translation_reasoning_effort = "none"
tts_model = "gpt-4o-mini-tts"
tts_voice = "marin"
